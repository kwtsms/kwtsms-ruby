name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.7", "3.0", "3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # 2026-11-05 08:07 +03: test number from the repo secret; tests that need it skip when unset (int-testnumber).
      - name: Run unit and mocked tests
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: bundle exec rake test

      - name: Run integration tests
        if: matrix.ruby-version == '3.3'
        env:
          RUBY_USERNAME: ${{ secrets.RUBY_USERNAME }}
          RUBY_PASSWORD: ${{ secrets.RUBY_PASSWORD }}
        run: bundle exec rake test_integration
