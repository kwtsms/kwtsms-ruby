name: Auto-Tag on Version Bump

on:
  push:
    branches: [main]
    paths:
      - "lib/kwtsms/version.rb"
  # 2026-11-08 13:31 +03: manual run to re-check (repo sweep, Boss 13:29)
  workflow_dispatch:

# 2026-11-08 13:40 +03: read-only token by default; jobs that write declare it (Scorecard TokenPermissions, repo sweep)
permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          NEW_VERSION=$(sed -n 's/.*VERSION *= *"\([^"]*\)".*/\1/p' lib/kwtsms/version.rb)
          OLD_VERSION=$(git show HEAD~1:lib/kwtsms/version.rb 2>/dev/null | sed -n 's/.*VERSION *= *"\([^"]*\)".*/\1/p' || echo "")
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected: old=$OLD_VERSION new=$NEW_VERSION"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ] && [ -n "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.new }}"
          # 2026-11-08 13:31 +03: skip when the tag already exists (v0.4.0 was tagged by hand and this job failed)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do"; exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"
